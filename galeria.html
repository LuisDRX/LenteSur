<!DOCTYPE html>
<html lang="es">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

  <header class="site-header">
    <a href="index.html" class="logo">Lente Sur</a>
    <nav class="nav">
      <a href="index.html" class="nav-link">Inicio</a>
      <a href="galeria.html" class="nav-link active">Galería</a>
      <a href="sobre.html" class="nav-link">Sobre mí</a>
      <a href="contacto.html" class="nav-link">Contacto</a>
    </nav>
  </header>

  <main>
    <section class="page-intro">
      <p class="kicker">Archivo</p>
      <h1>Galería</h1>
      <p class="intro-copy">
        Una selección de series fotográficas ordenadas por lugar.
        Todas las imágenes fueron tomadas en película de formato medio.
      </p>
    </section>

    <section class="gallery">
      <figure>
        <img src="https://picsum.photos/id/28/700/900" alt="Valle al amanecer en tonos fríos">
        <figcaption>Valle al amanecer — Cordillera, 2025</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1043/700/900" alt="Sendero entre árboles en otoño">
        <figcaption>Sendero — Cordillera, 2025</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1036/700/900" alt="Bosque de coníferas con niebla">
        <figcaption>Niebla baja — Reserva Norte</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1039/700/900" alt="Costa rocosa con marea baja">
        <figcaption>Marea — Costa Sur</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1044/700/900" alt="Río entre piedras al atardecer">
        <figcaption>Cauce — Valle Central</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1053/700/900" alt="Campo abierto con luz baja">
        <figcaption>Campo abierto — Meseta</figcaption>
      </figure>
    </section>

    <div class="cta-row">
      <a href="contacto.html" class="btn btn-primary">Reservar una sesión</a>
    </div>

  <footer class="site-footer">
